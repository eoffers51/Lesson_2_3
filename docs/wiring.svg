<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 800 600" width="800" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Wiring of lesson 2.3. Same pins as main/config.h and diagram.json. -->
  <rect x="0" y="-50" width="800" height="600" rx="16" fill="#ffffff"/>
  <text x="24" y="-18" font-size="20" font-weight="700" fill="#202124">Lesson 2.3 — wiring</text>
  <text x="24" y="2" font-size="13" fill="#5f6368">YD-ESP32-S3 (ESP32-S3-DevKitC-1 v1.0 clone) · no external parts, both are on the board</text>

  <!-- ===== Board ===== -->
  <rect x="320" y="30" width="180" height="480" rx="10" fill="#1f2a36"/>
  <rect x="378" y="40" width="64" height="20" rx="2" fill="#2c3a48"/>            <!-- antenna -->
  <rect x="372" y="62" width="76" height="120" rx="4" fill="#b8bec6"/>          <!-- module shield -->
  <text x="410" y="118" font-size="10" fill="#3c4043" text-anchor="middle" font-weight="700">ESP32-S3</text>
  <text x="410" y="132" font-size="9" fill="#3c4043" text-anchor="middle">WROOM-1</text>
  <rect x="380" y="512" width="34" height="18" rx="3" fill="#9aa0a6"/>          <!-- USB -->
  <rect x="426" y="512" width="34" height="18" rx="3" fill="#9aa0a6"/>
  <text x="397" y="545" font-size="9" fill="#5f6368" text-anchor="middle">UART</text>
  <text x="443" y="545" font-size="9" fill="#5f6368" text-anchor="middle">USB</text>

  <!-- J1 header (left), top to bottom; nothing used -->
  <g font-size="9" fill="#8a96a3">
    <g fill="#5d6873">
      <rect x="327" y="65" width="10" height="10"/><rect x="327" y="83" width="10" height="10"/><rect x="327" y="101" width="10" height="10"/><rect x="327" y="119" width="10" height="10"/><rect x="327" y="137" width="10" height="10"/><rect x="327" y="155" width="10" height="10"/><rect x="327" y="173" width="10" height="10"/><rect x="327" y="191" width="10" height="10"/><rect x="327" y="209" width="10" height="10"/><rect x="327" y="227" width="10" height="10"/><rect x="327" y="245" width="10" height="10"/><rect x="327" y="263" width="10" height="10"/><rect x="327" y="281" width="10" height="10"/><rect x="327" y="299" width="10" height="10"/><rect x="327" y="317" width="10" height="10"/><rect x="327" y="335" width="10" height="10"/><rect x="327" y="353" width="10" height="10"/><rect x="327" y="371" width="10" height="10"/><rect x="327" y="389" width="10" height="10"/><rect x="327" y="407" width="10" height="10"/><rect x="327" y="425" width="10" height="10"/><rect x="327" y="443" width="10" height="10"/>
    </g>
    <text x="343" y="73">3V3</text><text x="343" y="91">3V3</text><text x="343" y="109">RST</text><text x="343" y="127">4</text><text x="343" y="145">5</text><text x="343" y="163">6</text><text x="343" y="181">7</text><text x="343" y="199">15</text><text x="343" y="217">16</text><text x="343" y="235">17</text><text x="343" y="253">18</text><text x="343" y="271">8</text><text x="343" y="289">3</text><text x="343" y="307">46</text><text x="343" y="325">9</text><text x="343" y="343">10</text><text x="343" y="361">11</text><text x="343" y="379">12</text><text x="343" y="397">13</text><text x="343" y="415">14</text><text x="343" y="433">5V</text><text x="343" y="451">G</text>
  </g>
  <!-- J3 header (right) -->
  <g font-size="9" fill="#8a96a3" text-anchor="end">
    <g fill="#5d6873">
      <rect x="483" y="65" width="10" height="10"/><rect x="483" y="83" width="10" height="10"/><rect x="483" y="101" width="10" height="10"/><rect x="483" y="119" width="10" height="10"/><rect x="483" y="137" width="10" height="10"/><rect x="483" y="155" width="10" height="10"/><rect x="483" y="173" width="10" height="10"/><rect x="483" y="191" width="10" height="10"/><rect x="483" y="209" width="10" height="10"/><rect x="483" y="227" width="10" height="10"/><rect x="483" y="245" width="10" height="10"/><rect x="483" y="263" width="10" height="10"/><rect x="483" y="281" width="10" height="10"/><rect x="483" y="299" width="10" height="10"/><rect x="483" y="317" width="10" height="10"/><rect x="483" y="335" width="10" height="10"/><rect x="483" y="353" width="10" height="10"/><rect x="483" y="371" width="10" height="10"/><rect x="483" y="389" width="10" height="10"/><rect x="483" y="407" width="10" height="10"/><rect x="483" y="425" width="10" height="10"/><rect x="483" y="443" width="10" height="10"/>
    </g>
    <text x="477" y="73">G</text><text x="477" y="91">TX</text><text x="477" y="109">RX</text><text x="477" y="127">1</text><text x="477" y="145">2</text><text x="477" y="163">42</text><text x="477" y="181">41</text><text x="477" y="199">40</text><text x="477" y="217">39</text><text x="477" y="235">38</text><text x="477" y="253">37</text><text x="477" y="271">36</text><text x="477" y="289">35</text><text x="477" y="325">45</text><text x="477" y="361">47</text><text x="477" y="379">21</text><text x="477" y="397">20</text><text x="477" y="415">19</text><text x="477" y="433">G</text><text x="477" y="451">G</text>
  </g>
  <!-- used pins highlighted: GPIO0 and GPIO48 (on-board traces) -->
  <g fill="#f9ab00">
    <rect x="483" y="299" width="10" height="10"/><rect x="483" y="335" width="10" height="10"/>
  </g>
  <g font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="477" y="307">0</text><text x="477" y="343">48</text>
  </g>

  <!-- onboard RGB LED (GPIO48) and BOOT button (GPIO0) -->
  <rect x="398" y="290" width="24" height="24" rx="3" fill="#ffffff"/>
  <circle cx="410" cy="302" r="7" fill="url(#rgb)"/>
  <text x="410" y="328" font-size="9" fill="#e8eaed" text-anchor="middle">RGB</text>
  <rect x="362" y="470" width="24" height="24" rx="3" fill="#dadce0"/>
  <circle cx="374" cy="482" r="7" fill="#3c4043"/>
  <text x="374" y="465" font-size="9" fill="#e8eaed" text-anchor="middle">BOOT</text>
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea4335"/><stop offset="0.5" stop-color="#34a853"/><stop offset="1" stop-color="#4285f4"/>
    </linearGradient>
  </defs>

  <!-- ===== On-board traces (pin -> part), drawn as wires inside the board ===== -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4">
    <path d="M458 340 H440 V302 H422" stroke="#a142f4"/>   <!-- GPIO48 -> RGB DIN -->
    <path d="M462 304 H452 V482 H386" stroke="#9aa0a6"/>   <!-- GPIO0 -> BOOT -->
  </g>

  <!-- ===== Callouts ===== -->
  <g fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3">
    <path d="M493 340 H520"/>
    <path d="M493 304 H508 V478 H520"/>
  </g>
  <g font-size="12" fill="#202124">
    <text x="526" y="336" font-weight="700" fill="#a142f4">GPIO48 — onboard RGB LED</text>
    <text x="526" y="352" fill="#5f6368">WS2812, driven by led_strip (RMT)</text>
    <text x="526" y="474" font-weight="700">GPIO0 — BOOT button</text>
    <text x="526" y="490" fill="#5f6368">onboard, to GND, active LOW</text>
    <text x="526" y="506" fill="#5f6368">falling-edge interrupt + pull-up</text>
  </g>

  <!-- Modes table -->
  <g font-size="12" fill="#202124">
    <rect x="24" y="60" width="270" height="150" rx="10" fill="#f1f3f4"/>
    <text x="40" y="84" font-weight="700">Press BOOT → next LED mode</text>
    <text x="40" y="112">1. Blinking</text><text x="170" y="112" fill="#1a73e8" font-weight="700">toggle every 500 ms</text>
    <text x="40" y="136">2. Always On</text><text x="170" y="136" fill="#1a73e8" font-weight="700">dim blue</text>
    <text x="40" y="160">3. Always Off</text><text x="170" y="160" fill="#5f6368" font-weight="700">dark</text>
    <text x="40" y="190" font-size="10" fill="#5f6368">then back to Blinking · 50 ms debounce</text>
  </g>

  <!-- Note: nothing to wire -->
  <g font-size="12" fill="#202124">
    <rect x="24" y="240" width="270" height="92" rx="10" fill="#e8f0fe"/>
    <text x="40" y="264" font-weight="700">Nothing to wire</text>
    <text x="40" y="286" fill="#3c4043">Plug USB into the UART port.</text>
    <text x="40" y="306" fill="#3c4043">The dashed lines are traces on the</text>
    <text x="40" y="324" fill="#3c4043">board, not wires you add.</text>
  </g>
</svg>
